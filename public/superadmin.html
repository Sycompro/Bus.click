<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Bus.click Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body class="panel-super-admin-view">

    <div id="app-container" class="app-container">
        <!-- HEADER SUPER ADMIN -->
        <header class="main-header glass">
            <div class="header-left">
                <div class="brand">
                    <div class="brand-icon"><i data-lucide="shield-check"></i></div>
                    <div class="brand-text">
                        <h1>Bus.click</h1>
                        <span class="badge-version">SUPER ADMIN PORTAL</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="firebase-status-pill glass">
                    <span class="status-dot ping-active"></span>
                    <span class="status-text">Cloud Sync Active</span>
                </div>
            </div>
        </header>

        <div class="app-layout">
            <main class="main-content">
                <section id="panel-super-admin" class="panel-section">
                    <div class="panel-header-block">
                        <div>
                            <h2>Gestión Global de Ecosistema</h2>
                            <p class="section-desc">Crea y monitorea todas las empresas integradas en la plataforma.</p>
                        </div>
                        <div class="header-actions">
                            <button id="btn-seed-data" class="btn btn-secondary btn-sparkle">
                                <i data-lucide="database-backup"></i> Resetear / Cargar Datos Semilla
                            </button>
                        </div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-card glass">
                            <div class="metric-icon bg-indigo-500-10 text-indigo-400"><i data-lucide="building"></i></div>
                            <div class="metric-info"><h3>Empresas</h3><p class="metric-value" id="stat-super-companies">0</p></div>
                        </div>
                        <div class="metric-card glass">
                            <div class="metric-icon bg-emerald-500-10 text-emerald-400"><i data-lucide="milestone"></i></div>
                            <div class="metric-info"><h3>Sedes</h3><p class="metric-value" id="stat-super-sedes">0</p></div>
                        </div>
                        <div class="metric-card glass">
                            <div class="metric-icon bg-pink-500-10 text-pink-400"><i data-lucide="truck"></i></div>
                            <div class="metric-info"><h3>Flota</h3><p class="metric-value" id="stat-super-vehicles">0</p></div>
                        </div>
                        <div class="metric-card glass">
                            <div class="metric-icon bg-amber-500-10 text-amber-400"><i data-lucide="ticket"></i></div>
                            <div class="metric-info"><h3>Ventas</h3><p class="metric-value" id="stat-super-tickets">0</p></div>
                        </div>
                    </div>

                    <div class="content-split-layout">
                        <div class="form-container-card glass">
                            <h3 class="card-title"><i data-lucide="plus-circle"></i> Registrar Nueva Empresa</h3>
                            <form id="form-create-company" class="form-premium">
                                <div class="form-group">
                                    <label>Nombre Comercial</label>
                                    <input type="text" id="company-name" required placeholder="Ej: Transportes Flores">
                                </div>
                                <div class="form-group">
                                    <label>RUC</label>
                                    <div class="input-group-premium">
                                        <input type="text" id="company-ruc" required placeholder="Ej: 20123456789" maxlength="11">
                                        <button type="button" id="btn-buscar-ruc" class="btn btn-secondary btn-sparkle">
                                            <i data-lucide="search"></i> Consultar
                                        </button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Color Corporativo</label>
                                    <input type="color" id="company-color" value="#6366f1">
                                </div>
                                <button type="submit" class="btn btn-primary btn-full">Guardar Empresa</button>
                            </form>
                        </div>

                        <div class="list-container-card glass">
                            <h3 class="card-title"><i data-lucide="list"></i> Directorio de Empresas</h3>
                            <div class="table-scroll-container">
                                <table class="table-premium">
                                    <thead>
                                        <tr>
                                            <th>Empresa</th>
                                            <th>RUC</th>
                                            <th>Sedes</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="table-companies-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Forzar rol super-admin en esta vista
        state.currentRole = 'super-admin';
    </script>
</body>
</html>
